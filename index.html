<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIRWAN TOPUP - FINAL REALTIME SYSTEM 😈</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-analytics.js"></script>

    <style>
        :root { --dark: #0a0a0a; --neon: #00ff41; --blood: #ff0000; --card: #151515; }
        body { background: var(--dark); color: white; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 0; }
        .container { padding: 20px; max-width: 700px; margin: auto; }
        
        /* UI FORM CUSTOMER */
        .card { background: var(--card); padding: 25px; border: 1px solid #333; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1, h3 { color: var(--neon); text-transform: uppercase; letter-spacing: 2px; text-align: center; margin-top: 0; }
        input, select, button { width: 100%; padding: 12px; margin: 10px 0; background: #222; border: 1px solid #444; color: white; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        button { background: var(--neon); color: black; font-weight: bold; cursor: pointer; border: none; transition: 0.3s; }
        button:hover { background: #00cc33; transform: scale(1.02); box-shadow: 0 0 15px var(--neon); }

        /* UI ADMIN DASHBOARD (REAL-TIME) */
        #admin-section { display: none; animation: fadeIn 0.4s ease-in; }
        .stats-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .stat-box { background: #1a1a1a; padding: 15px; border: 1px solid var(--neon); text-align: center; border-radius: 10px; }
        .stat-box h2 { margin: 5px 0; color: var(--neon); font-size: 24px; }
        .stat-box p { margin: 0; font-size: 11px; color: #888; text-transform: uppercase; }

        .order-card { background: #111; border-left: 5px solid var(--neon); padding: 15px; margin-bottom: 15px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #222; }
        .order-info b { font-size: 18px; color: var(--neon); }
        .order-info p { margin: 4px 0; color: #aaa; font-size: 13px; }
        
        .badge { padding: 3px 10px; border-radius: 20px; font-size: 10px; font-weight: bold; text-transform: uppercase; display: inline-block; margin-bottom: 5px; }
        .pending { background: #554400; color: #ffcc00; }
        .success { background: #004411; color: #00ff41; }

        .action-btns { display: flex; gap: 8px; }
        .btn-done { background: var(--neon); color: black; width: 65px; padding: 7px; font-size: 11px; border-radius: 4px; }
        .btn-del { background: var(--blood); color: white; width: 65px; padding: 7px; font-size: 11px; border-radius: 4px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    <h1 id="title">VIRWAN TOPUP AI 😈</h1>

    <div class="card" id="user-form">
        <h3>PILIH PRODUK</h3>
        <input type="text" id="user_id" placeholder="Masukkan ID Game (Contoh: 12345678)" required>
        <select id="nominal">
            <option value="50 Diamonds (Rp 15.000)">50 Diamonds - Rp 15.000</option>
            <option value="100 Diamonds (Rp 30.000)">100 Diamonds - Rp 30.000</option>
            <option value="1000 Diamonds (Rp 250.000)">1000 Diamonds - Rp 250.000</option>
        </select>
        <input type="number" id="whatsapp" placeholder="No WhatsApp Aktif (628...)" required>
        <button onclick="kirimOrder()">KIRIM PESANAN SEKARANG! 🚀</button>
        <button style="background: #222; color: #444; margin-top: 15px; font-size: 10px;" onclick="showLogin()">ADMIN CONTROL</button>
    </div>

    <div id="admin-section">
        <div class="stats-container">
            <div class="stat-box">
                <p>Total Pesanan</p>
                <h2 id="total-count">0</h2>
            </div>
            <div class="stat-box">
                <p>Estimasi Duit</p>
                <h2 id="total-cuan">Rp 0</h2>
            </div>
        </div>

        <div class="card">
            <h3 style="text-align: left; border-bottom: 1px solid #333; padding-bottom: 10px;">MONITORING LIVE</h3>
            <div id="order-list">Menunggu data masuk dari database...</div>
            <button onclick="location.reload()" style="background: #333; margin-top: 20px; color: #ff4444;">KELUAR ADMIN</button>
        </div>
    </div>
</div>

<script>
    // --- KONFIGURASI FIREBASE ---
    const firebaseConfig = {
        apiKey: "AIzaSyA3xNFbqU1PGfC4OYqCd0sRDhlTDzdmAVI",
        authDomain: "web-topup-43b4d.firebaseapp.com",
        databaseURL: "https://web-topup-43b4d-default-rtdb.firebaseio.com",
        projectId: "web-topup-43b4d",
        storageBucket: "web-topup-43b4d.firebasestorage.app",
        messagingSenderId: "435775818250",
        appId: "1:435775818250:web:c935497791f2aa0da0adf3",
        measurementId: "G-H2XEYS6V0E"
    };

    // Inisialisasi Firebase
    firebase.initializeApp(firebaseConfig);
    firebase.analytics();
    const db = firebase.database();

    // 1. FUNGSI KIRIM ORDER (USER)
    function kirimOrder() {
        const id = document.getElementById('user_id').value;
        const nom = document.getElementById('nominal').value;
        const wa = document.getElementById('whatsapp').value;

        if(!id || !wa) return alert("Woi! Datanya jangan dikosongin, Bego!");

        const orderData = {
            id_game: id,
            item: nom,
            whatsapp: wa,
            status: "PENDING",
            timestamp: Date.now()
        };

        db.ref('orders/').push(orderData).then(() => {
            alert("SUCCESS! Pesanan lo sudah masuk ke sistem.");
            document.getElementById('user_id').value = "";
            document.getElementById('whatsapp').value = "";
        }).catch(err => alert("Error: " + err.message));
    }

    // 2. FUNGSI LOGIN ADMIN
    function showLogin() {
        const pass = prompt("MASUKKAN KODE AKSES:");
        if(pass === "VirWan2323") {
            document.getElementById('user-form').style.display = 'none';
            document.getElementById('title').innerText = "ADMIN PANEL ACTIVE 💀";
            document.getElementById('admin-section').style.display = 'block';
            listenOrders(); // Jalankan listener data
        } else {
            alert("Salah! Lu bukan owner gua, anj!");
        }
    }

    // 3. LISTEN DATA REAL-TIME
    function listenOrders() {
        db.ref('orders/').on('value', (snapshot) => {
            const list = document.getElementById('order-list');
            const countEl = document.getElementById('total-count');
            const cuanEl = document.getElementById('total-cuan');
            
            list.innerHTML = "";
            let count = 0;
            let cuan = 0;

            if(!snapshot.exists()) {
                list.innerHTML = "<p style='text-align:center; color:#444;'>Belum ada orderan masuk.</p>";
            }

            snapshot.forEach((child) => {
                const data = child.val();
                count++;

                // Kalkulasi cuan otomatis
                if(data.item.includes("15.000")) cuan += 15000;
                if(data.item.includes("30.000")) cuan += 30000;
                if(data.item.includes("250.000")) cuan += 250000;

                const statusClass = data.status === "SUCCESS" ? "success" : "pending";

                list.innerHTML += `
                    <div class="order-card">
                        <div class="order-info">
                            <span class="badge ${statusClass}">${data.status}</span><br>
                            <b>ID: ${data.id_game}</b>
                            <p>${data.item}</p>
                            <p>WA: <a href="https://wa.me/${data.whatsapp}" target="_blank" style="color:var(--neon); text-decoration:none;">${data.whatsapp}</a></p>
                        </div>
                        <div class="action-btns">
                            <button class="btn-done" onclick="updateStatus('${child.key}')">DONE</button>
                            <button class="btn-del" onclick="deleteOrder('${child.key}')">X</button>
                        </div>
                    </div>
                `;
            });

            countEl.innerText = count;
            cuanEl.innerText = "Rp " + cuan.toLocaleString('id-ID');
        });
    }

    // 4. FUNGSI UPDATE STATUS
    function updateStatus(key) {
        db.ref('orders/' + key).update({ status: "SUCCESS" });
    }

    // 5. FUNGSI HAPUS DATA
    function deleteOrder(key) {
        if(confirm("Hapus pesanan ini selamanya?")) {
            db.ref('orders/' + key).remove();
        }
    }
</script>

</body>
</html>
